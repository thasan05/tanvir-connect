    .glow { position:fixed; width:300px; height:300px; border-radius:50%; filter:blur(90px); opacity:.15; pointer-events:none; animation:drift 12s ease-in-out infinite alternate; }

    .portrait-shell { position:relative; width:148px; height:148px; padding:4px; border-radius:50%; background:conic-gradient(from 205deg,rgba(108,232,255,.28),#8b7bff,#6ce8ff,rgba(108,232,255,.28)); box-shadow:0 0 0 8px rgba(108,232,255,.025),0 0 55px rgba(42,193,226,.16); transition:transform .35s ease,box-shadow .35s ease; }
    .portrait-shell:hover { transform:translateY(-3px); box-shadow:0 0 0 9px rgba(108,232,255,.04),0 0 68px rgba(42,193,226,.23); }
    .portrait { display:block; width:100%; height:100%; object-fit:cover; object-position:center 35%; border:4px solid #081522; border-radius:50%; }
    h1 { margin:25px 0 0; color:var(--text); font-size:clamp(23px,6vw,29px); font-weight:750; letter-spacing:-.055em; line-height:1.2; }
    h1 span { background:linear-gradient(100deg,#f7fbff 15%,#a4f1ff 58%,#a99cff 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .name-underline { width:36px; height:3px; margin-top:14px; border-radius:9px; background:linear-gradient(90deg,var(--accent),var(--accent2)); box-shadow:0 0 18px rgba(108,232,255,.35); }
    nav { display:flex; justify-content:center; align-items:center; flex-wrap:wrap; gap:13px; margin-top:32px; }
    .social { position:relative; display:grid; place-items:center; width:49px; height:49px; border:1px solid var(--stroke); border-radius:17px; color:#dce8f0; background:linear-gradient(145deg,rgba(255,255,255,.085),rgba(255,255,255,.025)); box-shadow:0 8px 24px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.04); text-decoration:none; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); transition:transform .22s ease,color .22s ease,border-color .22s ease,background .22s ease,box-shadow .22s ease; -webkit-tap-highlight-color:transparent; }
    .social svg { width:21px; height:21px; display:block; } .social:hover { transform:translateY(-5px); color:var(--accent); border-color:rgba(108,232,255,.45); background:rgba(108,232,255,.09); box-shadow:0 12px 30px rgba(0,0,0,.22),0 0 24px rgba(108,232,255,.08); } .social:active { transform:translateY(-1px) scale(.97); } .social:focus-visible { outline:2px solid var(--accent); outline-offset:4px; }
    .social::after { content:attr(data-label); position:absolute; left:50%; bottom:calc(100% + 11px); transform:translate(-50%,4px); padding:6px 9px; border:1px solid var(--stroke); border-radius:8px; background:#0b1725; color:var(--text); font-size:11px; font-weight:600; white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .18s ease,transform .18s ease; }
    .social:hover::after,.social:focus-visible::after { opacity:1; transform:translate(-50%,0); }
    @keyframes arrive { from { opacity:0; transform:translateY(13px); } to { opacity:1; transform:translateY(0); } } @keyframes drift { from { transform:translate3d(-15px,0,0) scale(.95); } to { transform:translate3d(20px,25px,0) scale(1.08); } }
    @media(max-width:380px) { .portrait-shell { width:128px; height:128px; } nav { gap:10px; margin-top:27px; } .social { width:45px; height:45px; border-radius:15px; } h1 { margin-top:22px; } }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important; scroll-behavior:auto!important; } }
